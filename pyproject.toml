[project]
name = "codepilot-00"
version = "0.0.0"
description = "A command-line AI assistant for generating and testing Python code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Prit_kanani" }
]
requires-python = ">=3.14"
keywords = ["ai", "code-generation", "command-line"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=3.31.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "codepilot"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
codepilot = "codepilot.cli:app"

[project.urls]
Repository = "https://github.com/kevit-prit-kanani/Agents"
Issues = "https://github.com/kevit-prit-kanani/Agents/issues"
