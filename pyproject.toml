[project]
name = "codepilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kevit-prit-kanani", email = "prit.kanani@kevit.io" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.31.0",
    "openai-agents>=0.24.0",
    "prompt-toolkit>=3.0.53",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
codepilot = "codepilot.cli:app"
